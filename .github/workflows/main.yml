# 自包含版本：移除了对 hezhijie0327/Toolkit 外部脚本的依赖
# 推送使用 GitHub Actions 自带的 GITHUB_TOKEN（需在仓库 Settings → Actions → General
# → Workflow permissions 中开启 "Read and write permissions"）
name: Build & Release GFWList2AGH

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Checkout
        uses: actions/checkout@v7

      - name: Step 2 - Build GFWList2AGH
        run: |
          bash release.sh

      - name: Step 3 - Release GFWList2AGH
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Generated by GitHub Actions"
          git push
